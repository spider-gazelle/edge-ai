<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge AI Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    a {
      display: block;
      margin: 20px 0;
      font-size: 20px;
      color: #007BFF;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    input {
      margin: 20px 0;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Welcome to Edge AI Dashboard</h1>
  <p>Enter the ID for the monitor:</p>
  <input type="text" id="monitorId" placeholder="Enter ID">
  <a href="#" id="monitorLink">Monitor</a>
  <a href="#" id="detectorDebugLink">Detector Debug</a>

  <script>
    document.getElementById('monitorId').addEventListener('input', function() {
      const id = this.value;
      const monitorLink = document.getElementById('monitorLink');
      const detectorDebugLink = document.getElementById('detectorDebugLink');
      monitorLink.href = `monitor.html?id=${encodeURIComponent(id)}`;
      detectorDebugLink.href = `detector_debug.html?id=${encodeURIComponent(id)}`;
    });
  </script>
</body>
</html>
